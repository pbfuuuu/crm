{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn" href="{{ url_for('reports.dashboard') if g.user else url_for('auth.login') }}">На главную</a></p>
</div>
{% endblock %}
